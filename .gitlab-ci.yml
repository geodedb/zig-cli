---
# GitLab CI/CD Pipeline for cli
# SPDX-License-Identifier: Apache-2.0

# NOTE: Components are pinned to release tags (e.g., v1.7.1). For stronger
# supply-chain guarantees, pin to full commit SHAs. See SECURITY_GAP_ANALYSIS.md
# NS-001 for details. Current tags are from a first-party (devnw) catalog.
include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # Release
  # release-semantic: commit that ci-catalog tag v1.55.8 resolved to
  # (job-token creation of NEW releases under pipefail, SONNY-3448).
  - component: gitlab.com/devnw/ci-catalog/release-semantic@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      release_auth: job_token
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

variables:
  ZIG_VERSION: "0.16.0"

# Cache the Zig toolchain and build cache across jobs to avoid redundant
# downloads (~45 MB per job). The install-zig template already has a
# conditional check (`if [ ! -f "zig-${ZIG_VERSION}/zig" ]`) so it will
# skip download on cache hit.
default:
  interruptible: true
  cache:
    - key: "zig-${ZIG_VERSION}"
      paths:
        - "zig-${ZIG_VERSION}/"
    - key: "zig-cache-${CI_COMMIT_REF_SLUG}"
      paths:
        - ".zig-cache/"
      policy: pull-push
  tags:
    - company
    - linux
    - x86

stages:
  - lint
  - build
  - test
  - fuzz
  - security
  - sbom
  - release

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - |
    if ! command -v curl >/dev/null 2>&1 || ! command -v xz >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1; then
      apt-get update && apt-get install -y curl xz-utils python3
    fi
  - |
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

# Override zig-format component to use the project's ZIG_VERSION.
# The v1.2.1 component defaults to 0.14.0 and does not accept a version input.
zig-format:
  before_script:
    - *install-zig

# Build job
build:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build check

# Cross-compilation check: verify Windows and aarch64-linux code paths compile.
# This catches compilation errors in platform-specific code (signal.zig, tty.zig,
# env.zig, prompt.zig) that are not exercised by native builds.
# Uses `check` instead of `build` because the demo example links the external
# config dependency which has its own Windows compilation issues (xdg.zig).
cross-compile:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build check -Dtarget=x86_64-windows-gnu
    - zig build check -Dtarget=aarch64-linux-gnu

# Unit tests
test:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test --summary all
  needs:
    - build

# Integration tests
test-no-thread-pool:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-all -Dthread-pool=false --summary all
  needs:
    - build
  allow_failure: false

test-integration:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration --summary all
  needs:
    - build

# Release optimization tests
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# ReleaseFast tests
test-release-fast:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs:
    - build

test-integration-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseSafe --summary all
  needs:
    - build

test-integration-release-fast:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseFast --summary all
  needs:
    - build

# ReleaseSmall tests
test-release-small:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSmall --summary all
  needs:
    - build

# Coverage-guided fuzz testing.
# Runs with a 60-second timeout so the job always terminates.
#
# Exit-code semantics:
#   rc=0  : fuzzer stopped cleanly before timeout (no crash)
#   rc=124: timeout reached (expected in CI) - pass
#   other : fuzzer found a crash - fail the job
fuzz:
  stage: fuzz
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - timeout 60 zig build test --fuzz; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  artifacts:
    when: on_failure
    paths:
      - zig-out/fuzz/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build

# Benchmark regression detection.
# Runs benchmarks, stores results, and compares against the previous run's
# artifact. Warns on >20% regression in any benchmark.
# The comparison uses per-operation times extracted from bench output lines.
#
# MR pipelines: blocking (allow_failure: false) -- regressions must be reviewed.
# Main/schedule pipelines: soft (allow_failure: true) -- regressions are logged.
bench-regression:
  stage: fuzz
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build bench -Doptimize=ReleaseFast 2>&1 | tee bench-results.txt
    - |
      # --- Benchmark regression comparison ---
      # Try to download the previous run's artifact for comparison.
      BASELINE="bench-baseline.txt"
      HAS_BASELINE=false

      if [ -n "${CI_API_V4_URL:-}" ] && [ -n "${CI_PROJECT_ID:-}" ]; then
        curl -fsSL --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/main/raw/bench-results.txt?job=bench-regression" \
          -o "${BASELINE}" 2>/dev/null && HAS_BASELINE=true || true
      fi

      if [ "$HAS_BASELINE" = "true" ] && [ -s "$BASELINE" ]; then
        echo ""
        echo "=== Benchmark Regression Check (threshold: 20%) ==="
        echo ""
        REGRESSION_FOUND=false

        # Extract per-op times from bench output. Each benchmark line looks like:
        #   <name>    <total> <unit>  ( <per_op> <unit>/op, <iters> iterations)
        # We parse <name> and <per_op> in ns for comparison.

        # Convert a value+unit pair to nanoseconds for comparison
        to_ns() {
          local val="$1" unit="$2"
          case "$unit" in
            s)  python3 -c "print(int(float('$val') * 1000000000))" ;;
            ms) python3 -c "print(int(float('$val') * 1000000))" ;;
            us) python3 -c "print(int(float('$val') * 1000))" ;;
            ns) python3 -c "print(int(float('$val')))" ;;
            *)  echo "0" ;;
          esac
        }

        # Parse benchmark lines into "name per_op_ns" pairs
        parse_bench() {
          # Match lines with the per-op pattern: ( <number> <unit>/op,
          grep -oP '^\s*(.+?)\s+[\d.]+\s+\S+\s+\(\s*([\d.]+)\s+(\S+)/op' "$1" | \
          sed -E 's/^\s*(.+?)\s+[0-9.]+\s+\S+\s+\(\s*([0-9.]+)\s+(\S+)\/op/\1|\2|\3/' | \
          while IFS='|' read -r name val unit; do
            name=$(echo "$name" | sed 's/\s*$//')
            ns=$(to_ns "$val" "$unit")
            echo "${name}|${ns}"
          done
        }

        # Build associative-style comparison
        parse_bench bench-results.txt > /tmp/bench_current.txt
        parse_bench "$BASELINE" > /tmp/bench_baseline.txt

        while IFS='|' read -r name current_ns; do
          baseline_ns=$(grep -F "${name}|" /tmp/bench_baseline.txt 2>/dev/null | head -1 | cut -d'|' -f2)
          if [ -n "$baseline_ns" ] && [ "$baseline_ns" -gt 0 ] 2>/dev/null; then
            pct_change=$(python3 -c "
      curr, base = $current_ns, $baseline_ns
      change = ((curr - base) / base) * 100
      print(f'{change:+.1f}')
      ")
            # Check if regression exceeds 20%
            is_regression=$(python3 -c "print('yes' if ($current_ns - $baseline_ns) / $baseline_ns > 0.20 else 'no')")
            if [ "$is_regression" = "yes" ]; then
              echo "  WARN: ${name}: ${pct_change}% regression (${baseline_ns}ns -> ${current_ns}ns)"
              REGRESSION_FOUND=true
            else
              echo "  OK:   ${name}: ${pct_change}%"
            fi
          else
            echo "  NEW:  ${name}: no baseline to compare"
          fi
        done < /tmp/bench_current.txt

        echo ""
        if [ "$REGRESSION_FOUND" = "true" ]; then
          echo "WARNING: Benchmark regressions detected (>20% threshold)."
          echo "Review results above."
        else
          echo "All benchmarks within acceptable range."
        fi
      else
        echo ""
        echo "No previous benchmark baseline found. Storing current results as baseline."
        echo "Subsequent runs on main will compare against this baseline."
      fi
  artifacts:
    paths:
      - bench-results.txt
    expire_in: 90 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
  needs:
    - build

# Disable merge_request_event pipelines. Jobs without rules never run in MR
# pipelines, so the few MR-ruled jobs fail on `needs:` of jobs that are not
# there ("error on the CI/CD configuration file"), and that failed MR pipeline
# becomes the head pipeline that blocks auto-merge. Branch pipelines carry the
# real jobs; evaluate those. (Same fix as devnw/zig/uuid fc0d25fd.)
workflow:
  auto_cancel:
    on_job_failure: all
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # SRE-194: validation pipelines fail fast on the first blocking job failure;
    # these rules admit only what the next rule already admits.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      auto_cancel:
        on_job_failure: all
    - when: always

# SONNY-4778: tools must not redirect Git operations into this worktree.
hook-env-regression:
  stage: lint
  image: python:3.15-slim-bookworm
  tags: [company, linux, x86]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/test_hook_env.py

test-source-package:
  stage: test
  image: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
  tags: [company, linux, x86]
  before_script:
    - *install-zig
    - apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/check_source_package.py --jobs 2
  needs:
    - build
  allow_failure: false
